<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birdie Colors - Juego de Memoria Sonora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: #fdf2f8 url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1600&auto=format&fit=crop') center/cover fixed no-repeat;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Marco exterior metálico rosado estilo Nokia */
    .frame {
      width: 1000px;
      max-width: 98vw;
      background: linear-gradient(135deg, 
          #fce7f3 0%, 
          #f472b6 20%, 
          #f43f5e 45%, 
          #fda4af 55%, 
          #e11d48 80%, 
          #881337 100%);
      border: 4px solid #fff1f2;
      border-radius: 40px;
      padding: 20px;
      box-shadow: 0 30px 60px rgba(136, 19, 55, 0.4), inset 0 4px 10px rgba(255, 255, 255, 0.9);
      position: relative;
    }

    /* Pantalla interna morada */
    .board {
      background-color: #2e1065;
      border: 3px solid #fecdd3;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
      color: #fff;
    }

    header {
      text-align: center;
      border-bottom: 2px dashed rgba(255,255,255,0.3);
      padding-bottom: 8px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    p.instructions {
      color: #fef08a;
      font-size: 0.85rem;
      margin-top: 2px;
      font-weight: 600;
    }

    .hud-panel {
      width: 100%;
      background: rgba(131, 24, 67, 0.5);
      border: 1px solid #fda4af;
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .hud-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .hud-label {
      font-size: 0.7rem;
      color: #ffe4e6;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .hud-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fef08a;
    }

    .btn-action {
      background: linear-gradient(180deg, #f43f5e 0%, #be185d 100%);
      color: #fff;
      border: 1px solid #ffffff;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-family: 'Fredoka', cursive, sans-serif;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      background: #f43f5e;
    }

    .btn-action:disabled {
      background: #4c0519;
      color: #fda4af;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
      border-color: #881337;
    }

    .timer-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #fef08a, #f43f5e);
      transition: width 0.1s linear;
    }

    .viewport {
      position: relative;
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid #fecdd3;
      border-radius: 16px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 380px;
    }

    .victory-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(46, 16, 101, 0.9);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }

    .victory-card {
      background: linear-gradient(180deg, #831843 0%, #be185d 100%);
      border: 2px solid #fecdd3;
      padding: 25px 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .victory-card h2 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .victory-card p {
      color: #fef08a;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    .controls-bar {
      display: flex;
      width: 100%;
      gap: 12px;
      justify-content: center;
      margin-top: 4px;
    }

    .control-btn {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid #fda4af;
      color: #ffffff;
      font-weight: 700;
      border-radius: 14px;
      font-size: 0.95rem;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.25);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .control-btn:hover {
      background: rgba(244, 63, 94, 0.5);
      border-color: #ffffff;
    }

    .control-btn:active {
      transform: translateY(2px);
      background: #f43f5e;
    }

    .btn-back {
      background: linear-gradient(180deg, #ffffff 0%, #ffe4e6 60%, #f472b6 100%);
      color: #881337;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid #fda4af;
      box-shadow: 0 4px 0 #be185d, 0 5px 8px rgba(0,0,0,0.25);
      transition: all 0.1s ease;
      margin-top: 5px;
      font-size: 0.85rem;
    }

    .btn-back:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #be185d;
    }

    @media (max-width: 600px) {
      canvas {
        height: 320px;
      }
      .control-btn {
        font-size: 0.8rem;
        padding: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="frame">
    <div class="board">

      <header>
        <h1>🪶 Birdie Colors</h1>
        <p class="instructions">Usa [A] para Izquierda, [D] para Derecha y [ESPACIO] para Disparar</p>
      </header>

      <div class="hud-panel">
        <div class="hud-badge">
          <span class="hud-label">Estado</span>
          <span class="hud-value" id="gameStatus">Modo Exploración</span>
        </div>
        
        <div class="hud-badge">
          <span class="hud-label">Puntaje</span>
          <span class="hud-value" id="scoreText">0 / 5</span>
        </div>

        <button id="btnStart" class="btn-action">Iniciar Juego</button>
      </div>

      <div class="timer-bar-container">
        <div class="timer-bar" id="timerBar"></div>
      </div>

      <div class="viewport">
        <div class="victory-overlay" id="victoryOverlay">
          <div class="victory-card">
            <h2>🏆 ¡Ganaste!</h2>
            <p>Has alcanzado la meta de 5 puntos.</p>
            <button id="btnRestart" class="btn-action">Jugar de Nuevo</button>
          </div>
        </div>
        <canvas id="gameCanvas" width="640" height="380"></canvas>
      </div>

      <div class="controls-bar">
        <div class="control-btn" id="btnLeft">◄ A</div>
        <div class="control-btn" id="btnFire">🥚 ESPACIO</div>
        <div class="control-btn" id="btnRight">D ►</div>
      </div>

      <a href="../index.html" class="btn-back">🔙 VOLVER AL PORTAFOLIO</a>

    </div>
  </div>

  <script>
    const sonidos = {
      rojo: 'audios/rojo.mp3',
      negro: 'audios/negro.mp3',
      amarillo: 'audios/amarillo.mp3',
      blanco: 'audios/blanco.mp3',
      rosado: 'audios/rosado.mp3',
      celeste: 'audios/celeste.mp3'
    };

    const frecuencias = {
      rojo: 261.63, negro: 293.66, amarillo: 329.63,
      blanco: 349.23, rosado: 392.00, celeste: 440.00
    };

    const palette = {
      rojo: '#ef4444',
      negro: '#334155',
      amarillo: '#eab308',
      blanco: '#f8fafc',
      rosado: '#ec4899',
      celeste: '#0ea5e9'
    };

    let audioCtx = null;
    const audioBuffers = {};

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    async function cargarAudios() {
      for (let color in sonidos) {
        try {
          const res = await fetch(sonidos[color]);
          if (res.ok) {
            const buffer = await res.arrayBuffer();
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffers[color] = await audioCtx.decodeAudioData(buffer);
          }
        } catch (e) {}
      }
    }
    cargarAudios();

    function reproducirSonido(color) {
      initAudioContext();
      if (audioBuffers[color]) {
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffers[color];
        source.connect(audioCtx.destination);
        source.start(0);
      } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = frecuencias[color];
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let modoJuego = false;
    let colorObjetivo = null;
    let puntos = 0;
    const META_PUNTOS = 5;
    let tiempoRestante = 10;
    let intervaloTiempo = null;
    let escuchandoInteraccion = true;

    const bird = {
      x: canvas.width / 2,
      y: canvas.height - 40,
      radius: 28,
      speed: 7
    };

    let eggs = [];
    let particles = [];
    let targets = [];

    const keys = { left: false, right: false };

    function inicializarObjetivos() {
      targets = [];
      const keysColores = Object.keys(palette);

      keysColores.forEach((colorKey) => {
        targets.push({
          id: colorKey,
          x: Math.random() * (canvas.width - 120) + 60,
          y: Math.random() * 120 + 40,
          radius: 24,
          vx: (Math.random() - 0.5) * 4.5 || 2,
          vy: (Math.random() - 0.5) * 2.5 || 1,
          color: palette[colorKey],
          highlight: false,
          wrong: false
        });
      });
    }

    function reubicarPelotas() {
      targets.forEach(t => {
        t.x = Math.random() * (canvas.width - 120) + 60;
        t.y = Math.random() * 120 + 40;
        t.vx = (Math.random() - 0.5) * 5 || 2.5;
        t.vy = (Math.random() - 0.5) * 2.5 || 1;
        t.highlight = false;
        t.wrong = false;
      });
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        dispararHuevo();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnFire = document.getElementById('btnFire');

    btnLeft.addEventListener('mousedown', () => keys.left = true);
    btnLeft.addEventListener('mouseup', () => keys.left = false);
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    btnLeft.addEventListener('touchend', () => keys.left = false);

    btnRight.addEventListener('mousedown', () => keys.right = true);
    btnRight.addEventListener('mouseup', () => keys.right = false);
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    btnRight.addEventListener('touchend', () => keys.right = false);

    btnFire.addEventListener('click', () => dispararHuevo());

    function dispararHuevo() {
      initAudioContext();
      if (!escuchandoInteraccion) return;

      eggs.push({
        x: bird.x,
        y: bird.y - 32,
        vy: -9.5,
        radius: 7
      });
    }

    function crearParticulas(x, y, color) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          color: color,
          alpha: 1,
          size: Math.random() * 4 + 2
        });
      }
    }

    /* CABEZA CIRCULAR PERFECTA Y FLAT (SIN LINEAS) */
    function dibujarPajarito(x, y) {
      ctx.save();
      ctx.translate(x, y);

      const yellowColor = '#ffd534';
      const orangeColor = '#ff8c1a';
      const blackColor = '#000000';

      // 1. Silueta de la Cabeza Esférica + Cresta
      ctx.fillStyle = yellowColor;
      ctx.beginPath();
      ctx.arc(0, 0, 28, 0, Math.PI * 2); // Círculo principal perfecto
      ctx.arc(-8, -24, 11, 0, Math.PI * 2); // Cresta izquierda
      ctx.arc(7, -22, 10, 0, Math.PI * 2);  // Cresta derecha
      ctx.fill();

      // 2. Pico Ovalado Naranja
      ctx.fillStyle = orangeColor;
      ctx.beginPath();
      ctx.ellipse(0, 6, 10, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 3. Ojos Redondos Negros
      ctx.fillStyle = blackColor;
      ctx.beginPath();
      ctx.arc(-14, 2, 3.8, 0, Math.PI * 2);
      ctx.arc(14, 2, 3.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (keys.left && bird.x > 35) bird.x -= bird.speed;
      if (keys.right && bird.x < canvas.width - 35) bird.x += bird.speed;

      targets.forEach(t => {
        t.x += t.vx;
        t.y += t.vy;

        if (t.x - t.radius < 10 || t.x + t.radius > canvas.width - 10) t.vx *= -1;
        if (t.y - t.radius < 20 || t.y + t.radius > 200) t.vy *= -1;

        ctx.save();
        ctx.fillStyle = t.color;
        ctx.shadowColor = t.color;
        ctx.shadowBlur = t.highlight ? 30 : 15;

        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.beginPath();
        ctx.arc(t.x - t.radius * 0.3, t.y - t.radius * 0.3, t.radius * 0.35, 0, Math.PI * 2);
        ctx.fill();

        if (t.wrong) {
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 4;
          ctx.stroke();
        } else if (t.highlight) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.stroke();
        }

        ctx.restore();
      });

      for (let i = eggs.length - 1; i >= 0; i--) {
        const e = eggs[i];
        e.y += e.vy;

        ctx.save();
        ctx.fillStyle = '#fef08a';
        ctx.shadowColor = '#fef08a';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.ellipse(e.x, e.y, e.radius, e.radius * 1.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        targets.forEach(target => {
          const dx = e.x - target.x;
          const dy = e.y - target.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < e.radius + target.radius) {
            crearParticulas(e.x, e.y, target.color);

            if (!modoJuego) {
              reproducirSonido(target.id);
              target.highlight = true;
              setTimeout(() => target.highlight = false, 300);
            } else {
              evaluarImpacto(target.id, target);
            }

            eggs.splice(i, 1);
          }
        });

        if (e.y < 0) eggs.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) particles.splice(i, 1);
      }

      dibujarPajarito(bird.x, bird.y);

      requestAnimationFrame(render);
    }

    const btnStart = document.getElementById('btnStart');
    const btnRestart = document.getElementById('btnRestart');
    const victoryOverlay = document.getElementById('victoryOverlay');
    const gameStatus = document.getElementById('gameStatus');
    const scoreText = document.getElementById('scoreText');
    const timerBar = document.getElementById('timerBar');

    btnStart.addEventListener('click', iniciarPartida);
    btnRestart.addEventListener('click', iniciarPartida);

    function iniciarPartida() {
      initAudioContext();
      victoryOverlay.style.display = 'none';
      modoJuego = true;
      puntos = 0;
      scoreText.textContent = `${puntos} / ${META_PUNTOS}`;
      btnStart.disabled = true;
      document.querySelector('.instructions').textContent = '¡Identifica el tono y dispara a la pelota correspondiente!';
      siguienteRonda();
    }

    function finalizarJuego() {
      clearInterval(intervaloTiempo);
      modoJuego = false;
      escuchandoInteraccion = false;
      btnStart.disabled = false;
      gameStatus.textContent = '🏆 ¡Juego Completado!';
      timerBar.style.width = '0%';
      victoryOverlay.style.display = 'flex';
    }

    function siguienteRonda() {
      if (puntos >= META_PUNTOS) {
        finalizarJuego();
        return;
      }

      escuchandoInteraccion = true;
      gameStatus.textContent = '🔊 Reproduciendo...';
      reubicarPelotas();

      const coloresDisponibles = Object.keys(palette);
      colorObjetivo = coloresDisponibles[Math.floor(Math.random() * coloresDisponibles.length)];

      setTimeout(() => {
        reproducirSonido(colorObjetivo);
        iniciarTemporizador();
      }, 500);
    }

    function iniciarTemporizador() {
      tiempoRestante = 10;
      timerBar.style.width = '100%';
      gameStatus.textContent = '🎯 ¡Apunta y dispara!';

      clearInterval(intervaloTiempo);

      intervaloTiempo = setInterval(() => {
        tiempoRestante -= 0.1;
        const porcentaje = (tiempoRestante / 10) * 100;
        timerBar.style.width = `${porcentaje}%`;

        if (tiempoRestante <= 0) {
          clearInterval(intervaloTiempo);
          escuchandoInteraccion = false;
          gameStatus.textContent = '⏰ ¡Tiempo agotado!';

          const targetCorrecto = targets.find(t => t.id === colorObjetivo);
          if (targetCorrecto) targetCorrecto.wrong = true;

          setTimeout(() => {
            if (targetCorrecto) targetCorrecto.wrong = false;
            siguienteRonda();
          }, 1500);
        }
      }, 100);
    }

    function evaluarImpacto(colorImpactado, objetivo) {
      clearInterval(intervaloTiempo);
      escuchandoInteraccion = false;

      if (colorImpactado === colorObjetivo) {
        puntos++;
        scoreText.textContent = `${puntos} / ${META_PUNTOS}`;
        gameStatus.textContent = '🎉 ¡Buen tiro!';
        objetivo.highlight = true;

        setTimeout(() => {
          objetivo.highlight = false;
          if (puntos >= META_PUNTOS) {
            finalizarJuego();
          } else {
            siguienteRonda();
          }
        }, 1200);
      } else {
        gameStatus.textContent = '❌ ¡Fallaste!';
        objetivo.wrong = true;

        setTimeout(() => {
          objetivo.wrong = false;
          siguienteRonda();
        }, 1200);
      }
    }

    inicializarObjetivos();
    render();
  </script>
</body>
</html>
